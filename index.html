<style>
:root{--maroon:#4B0F19;--burg:#651A25;--gold:#D4AF62;--ivory:#FFF4DE;--pink:#E9B7B9;--brown:#35201B;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--maroon);color:var(--ivory);font:400 1.1rem/1.7 Mukta,'Noto Sans Devanagari',sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}
h1,h2,h3{font-family:'Noto Serif Devanagari',serif;margin:0;color:var(--gold);line-height:1.35}
.en{font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:.12em;color:var(--pink)}
section{position:relative;padding:72px 20px;text-align:center}
.wrap{max-width:1000px;margin:auto}
a{color:inherit}
.btn{display:inline-block;min-height:48px;padding:10px 26px;margin:6px;border:1.5px solid var(--gold);background:linear-gradient(var(--burg),var(--maroon));color:var(--ivory);font:600 1.05rem Mukta,sans-serif;border-radius:4px;cursor:pointer;text-decoration:none;box-shadow:0 0 0 3px var(--maroon),0 0 0 4px rgba(212,175,98,.5)}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--maroon);outline:none}
.btn.pulse{animation:pulse 2.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--maroon),0 0 22px 6px rgba(212,175,98,.55)}}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.orn{width:min(300px,70%);height:14px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);-webkit-mask:radial-gradient(circle 5px at 50% 50%,#000 98%,transparent) center/14px 14px repeat-x;mask:radial-gradient(circle 5px at 50% 50%,#000 98%,transparent) center/14px 14px repeat-x;opacity:.8}
.mandala{display:block;margin:0 auto 10px;width:110px;height:110px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pat{background:radial-gradient(circle at 50% 0,rgba(212,175,98,.12),transparent 60%),repeating-linear-gradient(45deg,rgba(212,175,98,.04) 0 2px,transparent 2px 22px),var(--maroon)}
.pat2{background:radial-gradient(circle at 50% 100%,rgba(212,175,98,.18),transparent 65%),var(--burg)}
/* intro */
#intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#7a2230,var(--maroon) 70%)}
#intro .door{position:absolute;top:0;bottom:0;width:calc(50% + 1px);background:repeating-linear-gradient(90deg,rgba(212,175,98,.08) 0 2px,transparent 2px 30px),linear-gradient(var(--burg),var(--maroon));border:2px solid var(--gold);transition:transform 1.4s cubic-bezier(.7,0,.2,1);z-index:2;display:flex;align-items:center}
#intro .l{left:0;justify-content:flex-end;transform-origin:left;border-right:0}#intro .r{right:0;border-left:0}#intro .door i{display:none}#intro .card>.mandala,#intro .card>.orn{margin-left:auto!important;margin-right:auto!important}
#intro .door i{width:14px;height:14px;border-radius:50%;background:var(--gold);margin:0 12px}
#intro.open .l{transform:translateX(-102%)}#intro.open .r{transform:translateX(102%)}
#intro.open .card{opacity:0;transition:opacity .5s}
#intro.gone{display:none}
#intro .card{position:relative;z-index:3;max-width:480px}
#intro .card>*{margin:.3rem 0}
#intro .skip{position:absolute;z-index:4;right:14px;top:calc(14px + env(safe-area-inset-top,0px));background:none;border:0;color:var(--pink);font:1rem Mukta;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 10px}
.emblem{font-size:3rem;filter:drop-shadow(0 0 12px rgba(212,175,98,.7))}
/* nav + controls */
#nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;gap:6px;align-items:center;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:calc(8px + env(safe-area-inset-top,0px)) 60px 8px 8px;background:rgba(75,15,25,.92);border-bottom:1px solid rgba(212,175,98,.4);overflow-x:auto;white-space:nowrap}
#nav a{font-size:.95rem;padding:6px 12px;text-decoration:none;color:var(--ivory);border-radius:3px}
#nav a:hover{color:var(--gold)}
#mus,#top{position:fixed;z-index:60;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--gold);background:var(--maroon);color:var(--gold);font-size:1.2rem;cursor:pointer}
#mus{right:8px;top:calc(4px + env(safe-area-inset-top,0px))}
#top{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity .3s}
#top.show{opacity:1;pointer-events:auto}
#prog{position:fixed;left:0;top:0;height:3px;width:100%;z-index:70;background:var(--gold);transform-origin:left;transform:scaleX(0)}
/* hero */
#hero{min-height:100svh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding-top:90px}
#hero h1{font-size:clamp(3rem,13vw,6.5rem);text-shadow:0 0 30px rgba(212,175,98,.4)}
.date{font:700 clamp(1.5rem,6vw,2.4rem) 'Noto Serif Devanagari',serif;color:var(--ivory)}
.palace{width:min(520px,92%);margin:0 auto 10px;display:block}
.down{display:block;margin:28px auto 0;color:var(--gold);font-size:2rem;animation:bob 1.8s infinite;text-decoration:none}
@keyframes bob{50%{transform:translateY(10px)}}
.petal{position:fixed;top:-30px;z-index:5;pointer-events:none;width:12px;height:16px;background:var(--pink);border-radius:80% 0 80% 0;opacity:.75;animation:fall linear infinite;will-change:transform}
@keyframes fall{to{transform:translate3d(60px,110vh,0) rotate(540deg)}}
/* countdown */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:560px;margin:24px auto}
.cd div{border:1px solid var(--gold);padding:14px 4px;background:rgba(75,15,25,.7)}
.cd b{display:block;font:700 clamp(1.8rem,9vw,3rem) 'Cormorant Garamond',serif;color:var(--gold)}
.cd span{font-size:.95rem}
/* timeline */
.day{margin:48px 0 20px;font-size:clamp(1.4rem,5vw,2rem)}
.tl{position:relative;max-width:1000px;margin:auto}
.line,.fill{position:absolute;top:0;bottom:0;left:22px;width:2px;background:rgba(212,175,98,.25)}
.fill{background:var(--gold);box-shadow:0 0 10px var(--gold);transform-origin:top;transform:scaleY(0);bottom:0}
.ev{position:relative;padding:0 0 36px 56px;text-align:left}
.ev::before{content:'';position:absolute;left:14px;top:18px;width:18px;height:18px;transform:rotate(45deg);background:var(--maroon);border:2px solid var(--gold)}
.box{border:1px solid rgba(212,175,98,.6);background:linear-gradient(160deg,var(--burg),var(--maroon));padding:20px;display:flex;gap:16px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.scene{flex:0 0 84px;height:104px;border:2px solid var(--gold);border-radius:42px 42px 4px 4px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background:radial-gradient(circle at 50% 70%,rgba(212,175,98,.35),var(--brown))}
.box h3{font-size:1.6rem}.time{color:var(--pink);font-weight:600}.box p{margin:4px 0 0;font-size:1rem}
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
@media(min-width:800px){
.line,.fill{left:50%;margin-left:-1px}
.ev{width:50%;padding:0 44px 44px 0}.ev::before{left:auto;right:-9px}
.ev:nth-child(even){margin-left:50%;padding:0 0 44px 44px}.ev:nth-child(even)::before{right:auto;left:-9px}
.ev.rv{transform:translateX(-40px)}.ev:nth-child(even).rv{transform:translateX(40px)}.ev.rv.in{transform:none}}
@media(max-width:430px){.box{flex-direction:column;text-align:center}.ev{text-align:center}}
/* venue / invite / final */
.gate{width:min(420px,90%);margin:0 auto 14px;display:block}
.addr{font-size:1.3rem;margin:8px 0 16px}
.frame{position:relative;max-width:560px;margin:auto;padding:44px 26px;border:3px double var(--gold);background:linear-gradient(var(--burg),var(--maroon));box-shadow:0 0 0 8px var(--maroon),0 0 0 9px var(--gold)}
.frame p{margin:.4rem 0}.msg{font-size:1.25rem;line-height:2}
.names{font:700 1.5rem 'Noto Serif Devanagari',serif;color:var(--gold)}
#fin{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fscene{font-size:clamp(2.6rem,12vw,4.5rem);letter-spacing:.1em;filter:drop-shadow(0 0 18px rgba(212,175,98,.6))}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:var(--maroon);padding:10px 20px;border-radius:4px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90%}
#toast.show{opacity:1}
footer{padding:20px;text-align:center;font-size:.9rem;color:var(--pink)}
html{-webkit-text-size-adjust:100%}a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#nav::-webkit-scrollbar{display:none}#nav a:first-child{margin-left:auto}#nav a:last-child{margin-right:auto}
.sc{display:block;width:min(480px,100%);margin:10px auto;overflow:visible}
.sc .gm{transform:translateX(-170px);opacity:0}.sc .br{transform:translateX(170px);opacity:0}
.sc.in .gm,.sc.in .br{animation:meet 2.6s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes meet{to{transform:translateX(8px);opacity:1}}@keyframes meetb{to{transform:translateX(-8px);opacity:1}}.sc.in .br{animation-name:meetb}.sc .ml{transform-box:fill-box;transform-origin:50% 0}.sc.in .ml{animation:swing 1.8s ease-in-out 2.6s infinite alternate}@keyframes swing{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.sc.in .bob{animation:sway .6s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateY(-4px)}}
.sc .gar{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.3)}
.sc.in .gar{animation:pop .9s 2.6s forwards}@keyframes pop{to{opacity:1;transform:scale(1)}}
.sc .glow{opacity:0}.sc.in .glow{animation:glow 3s 2.4s infinite alternate}@keyframes glow{from{opacity:.25}to{opacity:.85}}
.sc .ht{opacity:0}.sc.in .ht{animation:rise 3.2s 3s infinite}
@keyframes rise{0%{opacity:0;transform:translateY(0)}25%{opacity:1}100%{opacity:0;transform:translateY(-80px)}}
.sc .fl{animation:fl 1.4s infinite}@keyframes fl{50%{opacity:.55}}
.bd{display:block;width:min(560px,100%);margin:10px auto;cursor:pointer;overflow:visible}
.bd .st{transform-box:fill-box;transform-origin:0 0}.bd .st.l{transform-origin:100% 0}
.bd.in .st{animation:hitR .5s ease-in-out infinite}.bd.in .st.l{animation:hitL .5s ease-in-out .25s infinite}
@keyframes hitR{50%{transform:rotate(-30deg)}}@keyframes hitL{50%{transform:rotate(30deg)}}
.bd .dh{transform-box:fill-box;transform-origin:center}.bd.in .dh{animation:dr .5s ease-in-out infinite}@keyframes dr{50%{transform:scale(1.04,.93)}}
.bd.in .mn{animation:sway .5s ease-in-out infinite alternate}
.bd .rg{transform-box:fill-box;transform-origin:center;opacity:0}.bd.in .rg{animation:ring 1s ease-out infinite}@keyframes ring{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
.bd .ck{transform-box:fill-box;transform-origin:center}.bd.in .ck{animation:puff .7s ease-in-out infinite alternate}@keyframes puff{to{transform:scale(1.5)}}
.bd .nt{opacity:0}.bd.in .nt{animation:note 3s ease-out infinite}@keyframes note{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(40px,-90px)}}
.sc.in .gml{animation:giveG 1.5s ease-in-out 2.9s forwards}.sc.in .bml{animation:giveB 1.5s ease-in-out 2.9s forwards}
@keyframes giveG{to{transform:translate(84px,-56px)}}@keyframes giveB{to{transform:translate(-84px,-52px)}}
.bd .ar{transform-box:fill-box}.bd .ar.a{transform-origin:100% 100%}.bd .ar.b{transform-origin:0 100%}
.bd.in .ar.a{animation:armA .45s ease-in-out infinite alternate}.bd.in .ar.b{animation:armB .45s ease-in-out infinite alternate}
@keyframes armA{to{transform:rotate(-40deg)}}@keyframes armB{to{transform:rotate(40deg)}}
.bd.in .dn{animation:hop .45s ease-in-out infinite alternate}@keyframes hop{to{transform:translateY(-9px)}}
.bd .sk{transform-box:fill-box;transform-origin:50% 0}.bd.in .sk{animation:skw .45s ease-in-out infinite alternate}@keyframes skw{to{transform:scaleX(1.14) skewX(-4deg)}}
@media(prefers-reduced-motion:reduce){.sc .gml{transform:translate(84px,-56px)}.sc .bml{transform:translate(-84px,-52px)}}
@media(max-height:680px){#intro .mandala{width:64px;height:64px}#intro h1{font-size:2rem!important}#intro .card>*{margin:.15rem 0}}
@media(max-width:480px){section{padding:56px 16px}body{font-size:1.05rem}.btn{display:block;width:100%;max-width:340px;margin:10px auto}#chips .btn{display:inline-block;width:auto;margin:4px}.frame{padding:34px 16px}.msg{font-size:1.12rem}.cd{gap:6px}.cd div{padding:10px 2px}.box{padding:16px}.ev{padding-left:46px}.line,.fill{left:17px}.ev::before{left:9px}#nav a{padding:6px 10px;font-size:.9rem}.addr{font-size:1.15rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.sc .gm,.sc .br,.sc .gar,.sc .glow{opacity:1;transform:none}.sc .ht{opacity:.9}}
</style>
</head>

    { id: "d2", label: "बुधवार, 25 नवंबर 2026", events: [
      { title: "घुड़चढ़ी", time: "शाम 5:00 बजे", icon: "🐎", desc: "सजे हुए श्वेत अश्व पर दूल्हे की शाही घुड़चढ़ी।" },
      { title: "बारात प्रस्थान", time: "शाम 6:00 बजे", icon: "🥁", desc: "ढोल-नगाड़ों और गेंदे की सजावट के साथ बारात का प्रस्थान।" } ] }

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('show'),2500)};
// names (hidden until provided)
if(C.groomName&&C.brideName)$('#heroNames').textContent=C.groomName+' ❤ '+C.brideName;if(C.enNames)$('#heroEn').textContent=C.enNames;
const fam=[];
if(C.groomName||C.brideName)fam.push(`<p class="names">${[C.groomName,C.brideName].filter(Boolean).join(' ❤ ')}</p>${C.enNames?`<p class="en" style="font-size:1.3rem">${C.enNames}</p>`:''}`);
if(C.groomParents)fam.push(`<p>वर के माता-पिता: ${C.groomParents}</p>`);

if(C.familyMessage)fam.push(`<p>${C.familyMessage}</p>`);
$('#fam').innerHTML=fam.join('');
// timeline
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
$('#chips').innerHTML=C.days.map(d=>`<a class="btn" href="#${d.id}" style="min-height:44px;padding:6px 16px;font-size:.95rem">${esc(d.label)}</a>`).join('');
$('#evs').innerHTML=C.days.map(d=>`<h3 class="day" id="${d.id}" style="padding-left:0">${esc(d.label)}</h3>`+d.events.map(e=>`<article class="ev rv"><div class="box"><div class="scene" aria-hidden="true">${e.icon}</div><div><h3>${esc(e.title)}</h3><div class="time">${esc(d.label.split(',')[1].trim().replace(' 2026',''))} · ${esc(e.time)}</div><p>${esc(e.desc)}</p></div></div></article>`).join('')).join('');
// day headings sit outside the alternating grid on desktop: wrap children
$$('#evs .day').forEach(h=>{h.style.textAlign='center';h.style.margin='28px 0 24px';h.style.position='relative';h.style.background='var(--maroon)';h.style.zIndex='1'});
// reveal
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
// groom & bride animated scene (plays when scrolled into view)
const groom=()=>`<g class="bob"><circle cx="50" cy="34" r="11" fill="#f0c9a0"/><path d="M36 33q14-30 28 0z" fill="#D4AF62"/><path d="M50 8q8-8 12-2" stroke="#E9B7B9" stroke-width="3" fill="none"/><path d="M30 50h40l6 70H24z" fill="#FFF4DE"/><path d="M50 50v70" stroke="#D4AF62" stroke-width="2"/><path d="M31 54l-10 52M69 54l10 52" stroke="#FFF4DE" stroke-width="8" stroke-linecap="round"/><path d="M37 120v54M63 120v54" stroke="#D4AF62" stroke-width="12"/><circle cx="21" cy="106" r="5" fill="#f0c9a0"/><circle cx="79" cy="106" r="5" fill="#f0c9a0"/></g>`;
const bride=()=>`<g class="bob"><path d="M29 30q21-28 42 0l6 92H23z" fill="#E9B7B9" opacity=".9"/><circle cx="50" cy="34" r="11" fill="#f0c9a0"/><circle cx="50" cy="28" r="1.8" fill="#D4AF62"/><path d="M36 48h28l3 24H33z" fill="#b3263d"/><path d="M33 72h34l22 102H11z" fill="#b3263d"/><path d="M11 174h78" stroke="#D4AF62" stroke-width="4"/><path d="M40 72l-12 100M60 72l12 100" stroke="#D4AF62" stroke-width="1.5"/><path d="M35 52l-10 50M65 52l10 50" stroke="#f0c9a0" stroke-width="7" stroke-linecap="round"/><circle cx="25" cy="102" r="5" fill="#f0c9a0"/><circle cx="75" cy="102" r="5" fill="#f0c9a0"/></g>`;
const sceneSVG=`<svg class="sc" viewBox="0 0 400 250" role="img" aria-label="वर और वधू का जयमाला मिलन"><defs><radialGradient id="gg"><stop offset="0" stop-color="#D4AF62" stop-opacity=".6"/><stop offset="1" stop-color="#D4AF62" stop-opacity="0"/></radialGradient></defs><path d="M50 248V115Q200 -30 350 115V248" fill="none" stroke="#D4AF62" stroke-width="3"/><path d="M70 248V120Q200 -5 330 120V248" fill="none" stroke="#D4AF62" stroke-width="1" opacity=".5"/><circle class="glow" cx="200" cy="130" r="110" fill="url(#gg)"/><path d="M20 248h360" stroke="#D4AF62" stroke-width="2"/><g transform="translate(100 62)"><g class="gm">${groom()}</g></g><g transform="translate(200 62)"><g class="br">${bride()}</g></g><g transform="translate(100 62)"><g class="gm"><g class="bob"><g class="ml gml"><path d="M21 106Q50 150 79 106" fill="none" stroke="#F4A63A" stroke-width="9" stroke-dasharray="3 6" stroke-linecap="round"/><path d="M21 106Q50 150 79 106" fill="none" stroke="#D4AF62" stroke-width="1.5"/></g></g></g></g><g transform="translate(200 62)"><g class="br"><g class="bob"><g class="ml bml"><path d="M25 102Q50 146 75 102" fill="none" stroke="#e0526b" stroke-width="9" stroke-dasharray="3 6" stroke-linecap="round"/><path d="M25 102Q50 146 75 102" fill="none" stroke="#D4AF62" stroke-width="1.5"/></g></g></g></g><text class="fl" x="28" y="242" font-size="26">🪔</text><text class="fl" x="346" y="242" font-size="26">🪔</text>${[165,185,200,215,235].map((x,i)=>`<text class="ht" x="${x}" y="70" font-size="16" fill="#E9B7B9" style="animation-delay:${3+i*.5}s">❤</text>`).join('')}</svg>`;
$$('.scene-slot').forEach(s=>{s.innerHTML=sceneSVG;io.observe(s.firstChild)});
// dhol & shehnai band
const dholer=(x,c,d)=>`<g transform="translate(${x} 0)"><g class="mn" style="animation-delay:${d}s"><circle cx="0" cy="70" r="11" fill="#f0c9a0"/><path d="M-12 68q12-26 24 0z" fill="${c}"/><path d="M-16 82h32l6 60h-44z" fill="#FFF4DE"/><path d="M-12 142v54M12 142v54" stroke="${c}" stroke-width="11"/><path d="M-15 86l-3 8M15 86l3 8" stroke="#FFF4DE" stroke-width="7" stroke-linecap="round"/><g class="dh"><rect x="-36" y="106" width="72" height="26" rx="12" fill="#35201B" stroke="#D4AF62" stroke-width="2"/><path d="M-22 106v26M0 106v26M22 106v26" stroke="#D4AF62" stroke-width="1.5"/></g><path class="st l" d="M-18 94L-46 112" stroke="#D4AF62" stroke-width="4" stroke-linecap="round"/><path class="st" d="M18 94L46 112" stroke="#D4AF62" stroke-width="4" stroke-linecap="round"/></g><circle class="rg" cx="-40" cy="119" r="10" fill="none" stroke="#D4AF62" stroke-width="2"/><circle class="rg" cx="40" cy="119" r="10" fill="none" stroke="#E9B7B9" stroke-width="2" style="animation-delay:.5s"/></g>`;
const sheh=x=>`<g transform="translate(${x} 0)"><g class="mn" style="animation-delay:.2s"><circle cx="0" cy="70" r="11" fill="#f0c9a0"/><circle class="ck" cx="7" cy="75" r="5" fill="#E9B7B9" opacity=".7"/><path d="M-12 68q12-26 24 0z" fill="#b3263d"/><path d="M-16 82h32l6 60h-44z" fill="#FFF4DE"/><path d="M-12 142v54M12 142v54" stroke="#b3263d" stroke-width="11"/><path d="M8 78L58 128" stroke="#D4AF62" stroke-width="5" stroke-linecap="round"/><path d="M52 120l22 10-12 14z" fill="#D4AF62"/><path d="M-14 88l16 20M14 88l18 18" stroke="#FFF4DE" stroke-width="7" stroke-linecap="round"/><circle cx="2" cy="108" r="4" fill="#f0c9a0"/><circle cx="32" cy="106" r="4" fill="#f0c9a0"/></g>${[0,1,2].map(i=>`<text class="nt" x="66" y="124" font-size="20" fill="${i%2?'#E9B7B9':'#D4AF62'}" style="animation-delay:${i}s">${i%2?'♫':'♪'}</text>`).join('')}</g>`;
const bandSVG=`<svg class="bd" viewBox="0 0 400 330" role="img" aria-label="ढोल और शहनाई बजाते कलाकार"><path d="M0 14Q100 54 200 14T400 14" fill="none" stroke="#D4AF62" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/><path d="M10 198h380" stroke="#D4AF62" stroke-width="2"/>${dholer(70,'#D4AF62',0)}${sheh(200)}${dholer(335,'#E9B7B9',.25)}<path d="M10 312h380" stroke="#D4AF62" stroke-width="2" opacity=".5"/>${dancer(140,0)}${dancer(260,1)}</svg>`;
function dancer(x,g){return `<g transform="translate(${x} 205)"><g class="dn" style="animation-delay:${g?.22:0}s">${g?'<path d="M-11 14q11-20 22 0l5 42h-32z" fill="#E9B7B9" opacity=".9"/>':''}<circle cx="0" cy="16" r="9" fill="#f0c9a0"/>${g?'<circle cx="0" cy="11" r="1.5" fill="#D4AF62"/><path d="M-9 27h18l2 14h-22z" fill="#b3263d"/><g class="sk"><path d="M-11 41h22l17 62h-56z" fill="#b3263d"/><path d="M-28 103h56" stroke="#D4AF62" stroke-width="3"/></g>':'<path d="M-10 15q10-22 20 0z" fill="#D4AF62"/><path d="M-12 28h24l4 40h-32z" fill="#FFF4DE"/><path d="M-8 68v36M8 68v36" stroke="#D4AF62" stroke-width="9"/>'}<path class="ar a" d="M-12 32L-30 14" stroke="${g?'#f0c9a0':'#FFF4DE'}" stroke-width="6" stroke-linecap="round"/><path class="ar b" d="M12 32L30 14" stroke="${g?'#f0c9a0':'#FFF4DE'}" stroke-width="6" stroke-linecap="round"/></g></g>`}
// dhol + shehnai synthesized loop (starts only on button click)
let bandOn=false,bandT,bs=0;
const SC=[523.25,554.37,659.25,698.46,783.99,830.61],M1=[[0,1],[2,1],[3,.5],[4,.5],[3,1],[2,1],[1,1],[0,2]],M2=[[4,1],[5,1],[4,.5],[3,.5],[2,1],[3,1],[2,1],[0,2]];
function bdhol(t,hi){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';if(hi){o.frequency.setValueAtTime(230,t);o.frequency.exponentialRampToValueAtTime(120,t+.08);g.gain.setValueAtTime(.25,t)}else{o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(48,t+.18);g.gain.setValueAtTime(.55,t)}g.gain.exponentialRampToValueAtTime(.001,t+(hi?.12:.32));o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.36)}
function bsheh(f,t,d){const o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),fl=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=f;l.frequency.value=5.5;lg.gain.value=f*.012;l.connect(lg);lg.connect(o.frequency);fl.type='bandpass';fl.frequency.value=f*2;fl.Q.value=2.2;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.06);g.gain.setValueAtTime(.1,t+d-.08);g.gain.linearRampToValueAtTime(0,t+d);o.connect(fl);fl.connect(g);g.connect(ac.destination);o.start(t);l.start(t);o.stop(t+d+.05);l.stop(t+d+.05)}
function bandBar(){const b=.4,t0=ac.currentTime+.05;for(let i=0;i<8;i++){const t=t0+i*b;if(i%2==0)bdhol(t,0);bdhol(t+b/2,1);if(i%4==3)bdhol(t+b*.75,1)}let t=t0;(bs++%2?M2:M1).forEach(([d,n])=>{bsheh(SC[d],t,n*b*.95);t+=n*b})}
function bandStart(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return toast('इस ब्राउज़र में ध्वनि उपलब्ध नहीं');if(on)stop();ac=ac||new A();ac.resume();bandOn=true;bandBar();bandT=setInterval(bandBar,3200);$('#bandBtn').textContent='⏸ ध्वनि बंद करें';$('#bandBtn').setAttribute('aria-pressed','true')}
function bandStop(){bandOn=false;clearInterval(bandT);ac&&ac.suspend();$('#bandBtn').textContent='🥁 ढोल-शहनाई बजाएँ';$('#bandBtn').setAttribute('aria-pressed','false')}
function thump(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=ac||new A();ac.resume();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(55,t+.15);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.3)}
$$('.band-slot').forEach(s=>{s.innerHTML=bandSVG;io.observe(s.firstChild);s.firstChild.onclick=thump});
$('#bandBtn').onclick=()=>bandOn?bandStop():bandStart();
$$('.rv').forEach(e=>io.observe(e));
// countdown (absolute epoch from IST-offset target => correct in any device timezone)
const target=new Date(C.target).getTime();
function tick(){const diff=target-Date.now();
 if(diff<=0){$('.cd').hidden=true;$('#cdMsg').textContent=T.celebrate;return clearInterval(tick.i)}
 const p=n=>String(n).padStart(2,'0'),s=Math.floor(diff/1000);
 $('#d').textContent=p(Math.floor(s/86400));$('#h').textContent=p(Math.floor(s%86400/3600));$('#m').textContent=p(Math.floor(s%3600/60));$('#s').textContent=p(s%60);
 $('#cdMsg').textContent='25 नवंबर 2026, सायं 6:00 बजे (भारतीय समय)'}
tick();tick.i=setInterval(tick,1000);
// scroll progress, back to top, journey line
const fill=$('#fill'),tl=$('#tl');let tk=false;
function onScroll(){tk=false;const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;
 $('#prog').style.transform=`scaleX(${max>0?y/max:0})`;
 $('#top').classList.toggle('show',y>600);
 const r=tl.getBoundingClientRect(),f=Math.min(1,Math.max(0,(innerHeight*.6-r.top)/r.height));fill.style.transform=`scaleY(${f})`}
addEventListener('scroll',()=>{if(!tk){tk=true;requestAnimationFrame(onScroll)}},{passive:true});onScroll();
$('#top').onclick=()=>scrollTo({top:0});
$('#replay').onclick=()=>$('#journey').scrollIntoView();
// petals
if(!RM){const n=innerWidth<600?9:16;for(let i=0;i<n;i++){const p=document.createElement('i');p.className='petal';p.setAttribute('aria-hidden','true');
 p.style.cssText=`left:${Math.random()*100}vw;animation-duration:${9+Math.random()*9}s;animation-delay:${-Math.random()*14}s;transform:scale(${.6+Math.random()*.7})`;document.body.appendChild(p)}}
// music: gentle synthesized raga-like loop (no audio file); starts only after a click
let ac,on=false,timer,step=0;
const scale=[261.6,293.7,329.6,392,440,523.3,440,392,329.6,293.7];
function note(f,t,d){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.08);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05)}
function play(){if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return toast('इस ब्राउज़र में संगीत उपलब्ध नहीं');ac=new A()}
 ac.resume();on=true;const loop=()=>{const t=ac.currentTime;note(130.8,t,2.4);note(scale[step%scale.length],t+.1,1.4);step++};loop();timer=setInterval(loop,1500);ui()}
function stop(){on=false;clearInterval(timer);ac&&ac.suspend();ui()}
function ui(){$('#mus').setAttribute('aria-pressed',on);$('#mus').textContent=on?'♪':'🔇'}
$('#mus').onclick=()=>{if(bandOn)bandStop();on?stop():play()};ui();
// intro
function leave(withMusic){const i=$('#intro');i.classList.add('open');document.body.classList.remove('lock');
 if(withMusic)play();setTimeout(()=>i.classList.add('gone'),RM?0:1500);scrollTo(0,0)}
$('#enter').onclick=()=>leave(true);$('#skip').onclick=()=>leave(false);
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#intro').classList.contains('gone'))leave(false)});
// share / copy
async function copy(text,msg){try{await navigator.clipboard.writeText(text)}catch(_){const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}toast(msg)}
$('#copyAddr').onclick=()=>copy(T.venueShort,'पता कॉपी हो गया');
$('#share').onclick=async()=>{const d={title:'विनीत weds लीना · 24–25 नवंबर 2026',text:'आप सादर आमंत्रित हैं — '+T.venueShort,url:location.href};
 if(navigator.share){try{await navigator.share(d)}catch(e){if(e.name!=='AbortError')copy(location.href,'लिंक कॉपी हो गया')}}else copy(location.href,'निमंत्रण का लिंक कॉपी हो गया')};
</script>
